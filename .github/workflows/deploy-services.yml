name: Deploy services

on:
  push:
    branches: [master, staging, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  up:
    if: contains(vars.UP, github.base_ref || github.ref_name)
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Configure GCP credentials
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: "Install dependencies: infrastructure"
        run: go mod download
        working-directory: infrastructure

      - name: "Deploy stack: skulpture/imigresen/prod"
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: "skulpture/imigresen/prod"
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          work-dir: "infrastructure"
          upsert: true
          suppress-outputs: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          COMPUTE_INSTANCE_NAME: "imigresen"
          GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          GCP_SSH_PUBLIC_KEY: ${{ vars.GCP_SSH_PUBLIC_KEY }}

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build Docker image: imigresen-api"
        uses: docker/build-push-action@v5
        env:
          TAG: ${{ (env.BRANCH_NAME == 'master' && 'latest') || env.BRANCH_NAME }}
        with:
          context: "{{defaultContext}}:api/imigresen-api"
          platforms: ${{ matrix.os == 'ubuntu-latest' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          tags: |
            skulpture/imigresen-api:${{ env.TAG }}-${{ matrix.os == 'ubuntu-latest' && 'amd64' || 'arm64' }}

  docker-push:
    needs: build

    strategy:
      matrix:
        image: [skulpture/imigresen-api]

    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.image }}
        uses: Noelware/docker-manifest-action@v1
        env:
          TAG: ${{ (env.BRANCH_NAME == 'master' && 'latest') || env.BRANCH_NAME }}
        with:
          inputs: >
            ${{ matrix.image }}:${{ env.TAG }}-amd64,
            ${{ matrix.image }}:${{ env.TAG }}-arm64
          tags: >
            ${{ matrix.image }}:${{ env.TAG }}
          push: true

  deploy:
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: [api]
        branch: [master, dev] # dev

    environment: "imigresen-${{ matrix.branch }}"

    needs: [up, docker-push]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Copy files to GCP (${{ matrix.branch }})
        uses: appleboy/scp-action@master
        if: env.BRANCH_NAME == matrix.branch
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.GCP_SSH_PASSPHRASE }}
          port: 22
          overwrite: true
          source: "./*"
          target: "./imigresen-${{ env.BRANCH_NAME }}"

      - name: Deploy imigresen (${{ matrix.branch }})
        uses: appleboy/ssh-action@master
        if: contains(vars.DEPLOY, env.BRANCH_NAME) && env.BRANCH_NAME == matrix.branch
        env:
          STACK_NAME: ${{ matrix.service }}
          SERVICES_DOCKER_COMPOSE_FILE: ${{ env.BRANCH_NAME == 'master' && 'docker-compose.yml' || 'docker-compose.dev.yml'}}
          ENV_FILE: ~/.env
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.GCP_SSH_PASSPHRASE }}
          port: 22
          script: |
            # TODO: pull latest
            export $(docker run --rm --env-file ${{ env.ENV_FILE }} skulpture/kryptos:staging cat | xargs)

            cd imigresen-${{ env.BRANCH_NAME }}/${{ matrix.service }}

            docker system prune -af
            docker stack deploy --compose-file ${{ env.SERVICES_DOCKER_COMPOSE_FILE }} ${{ env.STACK_NAME }} --with-registry-auth --detach=true
